# Ablation 03 — validate LaRS 11-class with fine-tuned Lightning ckpt
trainer:
  max_epochs: 1
  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      project: water-debris-seg
      group: ablation03_finetune_lars_panoptic
      name: eomt_lars_panoptic_val_ft
      tags: [eomt, finetune, lars, panoptic, validate]
      log_model: false
model:
  class_path: training.mask_classification_panoptic.MaskClassificationPanoptic
  init_args:
    ckpt_path: null
    load_ckpt_class_head: false
    attn_mask_annealing_enabled: true
    attn_mask_annealing_start_steps: [14782, 36955, 59128]
    attn_mask_annealing_end_steps: [29564, 51737, 73910]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_q: 200
        num_blocks: 3
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_base_patch14_reg4_dinov2
data:
  class_path: water_debris_seg.eomt_adapters.lars_panoptic.LarsPanoptic
  init_args:
    num_classes: 11
    stuff_classes: [0, 1, 2]
    batch_size: 4
    num_workers: 4
    img_size: [640, 640]
